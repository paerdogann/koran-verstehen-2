name: Build and Deploy to all-inkl.com

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Production build al
        run: npm run build
        env:
          DISABLE_ESLINT_PLUGIN: true

      - name: (GEÇİCİ) Secret uzunluklarını kontrol et
        run: |
          echo "FTP_SERVER uzunluğu: ${#FTP_SERVER}"
          echo "FTP_USERNAME uzunluğu: ${#FTP_USERNAME}"
          echo "FTP_PASSWORD uzunluğu: ${#FTP_PASSWORD}"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: FTP ile all-inkl.com'a yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/
          server-dir: koranverstehen.de/
          protocol: ftp
